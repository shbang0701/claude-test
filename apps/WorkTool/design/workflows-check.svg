<?xml version="1.0" encoding="utf-8"?>
<svg width="720" height="2730" viewBox="0 0 480 1820" role="img" aria-labelledby="title desc" font-family="Noto Sans KR, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">WorkTool 사용자 구성 업무 목업</title>
  <desc id="desc">가짜 데이터로 계산한 구성, 사용, 모의 결과와 변경 비교. 실제 파일 생성, 알람, 서버 검사 없음.</desc>
  <rect fill="#F5F8FC" height="1820" rx="0" stroke="none" width="480" x="0" y="0" />
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="38.5">WorkTool  /  사용자 구성 업무</text>
  <text fill="#1D2B3A" font-size="26" font-weight="600" x="24" y="86.16">서버 점검</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="114.5">검토용 목업 · 가짜 데이터 · 실제 실행 없음</text>
  <rect fill="#FFFFFF" height="200" rx="12" stroke="#DCE3EC" width="432" x="24" y="140" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="183.2">1. 사용자가 만드는 구성</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="216.24">가상 폴더: 점검 / 서버 점검</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="240.24">폼: 서버 목록 · 제한 시간 · 재확인 시각</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="264.24">단계: ping 검사 → 기록 → 조건부 알람</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="288.24">알람 조건: 실패 개수 &gt; 0</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="312.24">가짜 응답표만 사용 · 실제 통신 없음</text>
  <rect fill="#FFFFFF" height="248" rx="12" stroke="#DCE3EC" width="432" x="24" y="356" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="399.2">2. 사용 순서와 입력값</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="432.24">서버 두 개와 제한 시간 1000ms를 입력합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="456.24">재확인 시각을 09:10으로 정합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="480.24">[실행] → 대상별 결과를 확인합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="488"></text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="528.24">서버 목록: 10.0.0.10, 10.0.0.11</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="552.24">제한 시간(ms): 1000</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="576.24">재확인 시각: 2026-10-23T09:10:00+09:00</text>
  <rect fill="#FFFFFF" height="344" rx="12" stroke="#DCE3EC" width="432" x="24" y="620" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="663.2">3. 사용 결과 미리보기</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="696.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="720.24">서버 ping 검사 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="744.24">10.0.0.10: 12ms · 성공</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="768.24">10.0.0.11: 시간 초과</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="792.24">실패 개수: 1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="816.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="840.24">기록 ID: mock-check-base-record</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="864.24">알람 예약 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="888.24">시각: 2026-10-23T09:10:00+09:00</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="912.24">제목: 서버 점검 재확인</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="936.24">연결 업무: mock-task-check-base</text>
  <rect fill="#FFFFFF" height="320" rx="12" stroke="#DCE3EC" width="432" x="24" y="980" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1023.2">4. 바꿔서 다시 사용하면</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1056.24">입력값 변경 · 제한 시간 1000ms → 2000ms</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1080.24">정의 버전: 1 → 1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1104.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1128.24">서버 ping 검사 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1152.24">10.0.0.10: 12ms · 성공</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1176.24">10.0.0.11: 1500ms · 성공</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1200.24">실패 개수: 0</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1224.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1248.24">기록 ID: mock-check-changed-record</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1272.24">알람 예약 → 조건 미충족 · 건너뜀</text>
  <rect fill="#FDF1DC" height="248" rx="12" stroke="#DCE3EC" width="432" x="24" y="1316" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1359.2">5. 실패·취소도 확인</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1392.24">검사 뒤 취소하면 다음 기록·알람을 시작하지 않습니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1416.24">전체 상태: 취소 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1440.24">서버 ping 검사 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1464.24">10.0.0.10: 12ms · 성공</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1488.24">10.0.0.11: 시간 초과</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1512.24">실패 개수: 1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1536.24">중단 위치: record 단계 시작 전</text>
  <rect fill="#FFFFFF" height="176" rx="12" stroke="#DCE3EC" width="432" x="24" y="1580" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1623.2">연결한 공통 기능</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1656.24">probe: network.ping v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1680.24">record: record.append v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1704.24">remind: alarm.schedule v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1728.24">내부 API 이름·형식은 제안입니다.</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="1786.5">실행 데이터: workflows-results.json</text>
</svg>