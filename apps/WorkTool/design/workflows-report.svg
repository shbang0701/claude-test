<?xml version="1.0" encoding="utf-8"?>
<svg width="720" height="2838" viewBox="0 0 480 1892" role="img" aria-labelledby="title desc" font-family="Noto Sans KR, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">WorkTool 사용자 구성 업무 목업</title>
  <desc id="desc">가짜 데이터로 계산한 구성, 사용, 모의 결과와 변경 비교. 실제 파일 생성, 알람, 서버 검사 없음.</desc>
  <rect fill="#F5F8FC" height="1892" rx="0" stroke="none" width="480" x="0" y="0" />
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="38.5">WorkTool  /  사용자 구성 업무</text>
  <text fill="#1D2B3A" font-size="26" font-weight="600" x="24" y="86.16">자료 작성</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="114.5">검토용 목업 · 가짜 데이터 · 실제 실행 없음</text>
  <rect fill="#FFFFFF" height="224" rx="12" stroke="#DCE3EC" width="432" x="24" y="140" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="183.2">1. 사용자가 만드는 구성</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="216.24">작업 위치: 선택한 폴더를 ‘작업폴더’로 표시</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="240.24">하위 폴더: 작업 폴더 / 기준 월</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="264.24">파일명: 제목_날짜_순번.txt</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="288.24">본문: 제목 · 기준 월 · 요약</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="312.24">단계: 경로 → 본문 → 새 파일 → 기록</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="336.24">새 창: 입력 완료까지 메인 대기</text>
  <rect fill="#FFFFFF" height="248" rx="12" stroke="#DCE3EC" width="432" x="24" y="380" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="423.2">2. 사용 순서와 입력값</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="456.24">[구성 편집]에서 경로·파일명·본문을 정합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="480.24">[새 업무 시작] → 제목·기준 월·요약 입력.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="504.24">[결과 미리보기]를 확인하고 [실행]합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="512"></text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="552.24">자료 제목: 월간 정리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="576.24">기준 월: 2026-10</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="600.24">요약: 가상 요청 3건 처리</text>
  <rect fill="#FFFFFF" height="320" rx="12" stroke="#DCE3EC" width="432" x="24" y="644" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="687.2">3. 사용 결과 미리보기</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="720.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="744.24">경로 조합 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="768.24">본문 구성 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="792.24">새 파일 생성 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="816.24">작업폴더/2026-10/월간 정리_20261023_001.txt</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="840.24">제목: 월간 정리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="864.24">기준 월: 2026-10</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="888.24">요약: 가상 요청 3건 처리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="912.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="936.24">기록 ID: mock-report-base-record</text>
  <rect fill="#FFFFFF" height="368" rx="12" stroke="#DCE3EC" width="432" x="24" y="980" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1023.2">4. 바꿔서 다시 사용하면</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1056.24">구성 2판 · 작업 위치 / 하위 폴더 / 이름 / 본문 변경</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1080.24">정의 버전: 1 → 2</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1104.24">예전 실행 이력은 1판 그대로 보존합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1128.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1152.24">경로 조합 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1176.24">본문 구성 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1200.24">새 파일 생성 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1224.24">다른작업폴더/완료/2026-10/20261023_월간 정리_002.txt</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1248.24">[2026-10] 월간 정리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1272.24">처리 내용: 가상 요청 3건 처리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1296.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1320.24">기록 ID: mock-report-changed-record</text>
  <rect fill="#FDF1DC" height="248" rx="12" stroke="#DCE3EC" width="432" x="24" y="1364" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1407.2">5. 실패·취소도 확인</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1440.24">저장 실패 시 다음 생성 기록을 실행하지 않습니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1464.24">전체 상태: 실패 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1488.24">경로 조합 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1512.24">본문 구성 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1536.24">새 파일 생성 → 실패</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1560.24">MOCK_WRITE_DENIED: 가짜 저장 실패입니다. 저장 위치를</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1584.24">확인하세요.</text>
  <rect fill="#FFFFFF" height="200" rx="12" stroke="#DCE3EC" width="432" x="24" y="1628" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1671.2">연결한 공통 기능</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1704.24">path: path.compose v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1728.24">content: content.render v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1752.24">save: file.create v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1776.24">record: record.append v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1800.24">내부 API 이름·형식은 제안입니다.</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="1858.5">실행 데이터: workflows-results.json</text>
</svg>