<?xml version="1.0" encoding="utf-8"?>
<svg width="720" height="2586" viewBox="0 0 480 1724" role="img" aria-labelledby="title desc" font-family="Noto Sans KR, 'Noto Sans KR', 'Malgun Gothic', sans-serif" xmlns="http://www.w3.org/2000/svg">
  <title id="title">WorkTool 사용자 구성 업무 목업</title>
  <desc id="desc">가짜 데이터로 계산한 구성, 사용, 모의 결과와 변경 비교. 실제 파일 생성, 알람, 서버 검사 없음.</desc>
  <rect fill="#F5F8FC" height="1724" rx="0" stroke="none" width="480" x="0" y="0" />
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="38.5">WorkTool  /  사용자 구성 업무</text>
  <text fill="#1D2B3A" font-size="26" font-weight="600" x="24" y="86.16">요청 처리</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="114.5">검토용 목업 · 가짜 데이터 · 실제 실행 없음</text>
  <rect fill="#FFFFFF" height="200" rx="12" stroke="#DCE3EC" width="432" x="24" y="140" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="183.2">1. 사용자가 만드는 구성</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="216.24">가상 폴더: 일반 업무 / 요청 처리</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="240.24">폼: 요청 번호 · 제목 · 물품 · 수량 · 확인 시각</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="264.24">선택지와 필수 여부도 사용자가 편집</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="288.24">단계: 기록 추가 → 알람 예약</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="312.24">새 창: 메인과 함께 사용</text>
  <rect fill="#FFFFFF" height="344" rx="12" stroke="#DCE3EC" width="432" x="24" y="356" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="399.2">2. 사용 순서와 입력값</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="432.24">[새 업무 시작] → 요청 내용을 입력합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="456.24">대여 가능·반납 시각을 확인하고 체크합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="480.24">후속 확인 시각을 정하고 [실행]합니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="488"></text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="528.24">요청 번호: DEMO-001</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="552.24">요청 제목: 회의실 장비 대여</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="576.24">물품: 프로젝터</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="600.24">수량: 1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="624.24">후속 확인 시각: 2026-10-23T14:00:00+09:00</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="648.24">대여 가능 확인: 확인함</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="672.24">반납 시각 확인: 확인함</text>
  <rect fill="#FFFFFF" height="272" rx="12" stroke="#DCE3EC" width="432" x="24" y="716" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="759.2">3. 사용 결과 미리보기</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="792.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="816.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="840.24">기록 ID: mock-request-base-record</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="864.24">회의실 장비 대여 / 프로젝터 1개</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="888.24">알람 예약 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="912.24">시각: 2026-10-23T14:00:00+09:00</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="936.24">제목: 회의실 장비 대여</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="960.24">연결 업무: mock-task-request-base</text>
  <rect fill="#FFFFFF" height="320" rx="12" stroke="#DCE3EC" width="432" x="24" y="1004" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1047.2">4. 바꿔서 다시 사용하면</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1080.24">입력값 변경 · 케이블 2개 / 후속 확인 15:30</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1104.24">정의 버전: 1 → 1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1128.24">전체 상태: 모의 완료 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1152.24">기록 추가 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1176.24">기록 ID: mock-request-changed-record</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1200.24">연결 케이블 대여 / 케이블 2개</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1224.24">알람 예약 → 모의 완료</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1248.24">시각: 2026-10-23T15:30:00+09:00</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1272.24">제목: 연결 케이블 대여</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1296.24">연결 업무: mock-task-request-changed</text>
  <rect fill="#FDF1DC" height="152" rx="12" stroke="#DCE3EC" width="432" x="24" y="1340" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1383.2">5. 실패·취소도 확인</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1416.24">제목이 비어 있으면 기록·알람을 시작하지 않습니다.</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1440.24">전체 상태: 실패 · 실제 실행 없음</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1464.24">INPUT_REQUIRED: 요청 제목 항목을 입력하거나 확인하세요.</text>
  <rect fill="#FFFFFF" height="152" rx="12" stroke="#DCE3EC" width="432" x="24" y="1508" />
  <text fill="#1D2B3A" font-size="20" font-weight="600" x="48" y="1551.2">연결한 공통 기능</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1584.24">record: record.append v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1608.24">remind: alarm.schedule v1</text>
  <text fill="#1D2B3A" font-size="14" font-weight="400" x="48" y="1632.24">내부 API 이름·형식은 제안입니다.</text>
  <text fill="#56667A" font-size="12.5" font-weight="400" x="24" y="1690.5">실행 데이터: workflows-results.json</text>
</svg>